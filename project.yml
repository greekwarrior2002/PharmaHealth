name: PharmaHealth
options:
  bundleIdPrefix: com.yourdomain
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:
  PharmaHealth:
    type: application
    platform: iOS
    sources:
      - path: PharmaHealth
        excludes:
          - "Info.plist"
          - "PharmaHealth.entitlements"
    resources:
      - PharmaHealth/Assets.xcassets
    info:
      path: PharmaHealth/Info.plist
    entitlements:
      path: PharmaHealth/PharmaHealth.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourdomain.pharmahealth
        CODE_SIGN_ENTITLEMENTS: PharmaHealth/PharmaHealth.entitlements
        INFOPLIST_FILE: PharmaHealth/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: PharmaHealthWidget
      - package: RevenueCat
        product: RevenueCat

  PharmaHealthWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PharmaHealthWidget
        excludes:
          - "Info.plist"
          - "PharmaHealthWidget.entitlements"
      - path: PharmaHealth/Models
      - path: PharmaHealth/Services/RefillCalculator.swift
      - path: PharmaHealth/Utilities/Extensions.swift
    resources:
      - PharmaHealthWidget/Assets.xcassets
    info:
      path: PharmaHealthWidget/Info.plist
    entitlements:
      path: PharmaHealthWidget/PharmaHealthWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourdomain.pharmahealth.widget
        CODE_SIGN_ENTITLEMENTS: PharmaHealthWidget/PharmaHealthWidget.entitlements
        INFOPLIST_FILE: PharmaHealthWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
