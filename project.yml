name: MedBridge
options:
  bundleIdPrefix: com.yourdomain
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"

targets:
  MedBridge:
    type: application
    platform: iOS
    sources:
      - path: MedBridge
        excludes:
          - "Info.plist"
          - "MedBridge.entitlements"
    resources:
      - MedBridge/Assets.xcassets
    info:
      path: MedBridge/Info.plist
    entitlements:
      path: MedBridge/MedBridge.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourdomain.medbridge
        CODE_SIGN_ENTITLEMENTS: MedBridge/MedBridge.entitlements
        INFOPLIST_FILE: MedBridge/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: MedBridgeWidget
      - package: RevenueCat
        product: RevenueCat

  MedBridgeWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MedBridgeWidget
        excludes:
          - "Info.plist"
          - "MedBridgeWidget.entitlements"
      - path: MedBridge/Models
      - path: MedBridge/Services/RefillCalculator.swift
      - path: MedBridge/Utilities/Extensions.swift
    resources:
      - MedBridgeWidget/Assets.xcassets
    info:
      path: MedBridgeWidget/Info.plist
    entitlements:
      path: MedBridgeWidget/MedBridgeWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourdomain.medbridge.widget
        CODE_SIGN_ENTITLEMENTS: MedBridgeWidget/MedBridgeWidget.entitlements
        INFOPLIST_FILE: MedBridgeWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
